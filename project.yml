name: DKBClamshellNative
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
# Local.xcconfig is gitignored and per-machine: it carries CODE_SIGN_IDENTITY
# (the self-signed "DKB Clamshell Local Signing" certificate that
# scripts/create-signing-cert.sh creates, or "-" for ad-hoc). xcodegen refuses
# to generate without the file, on purpose. Plan §3.2 D1: the Screen Recording
# grant (TCC) is keyed on the signing identity — ad-hoc would re-prompt after
# every rebuild; the certificate keeps it (verified in Phase 0.4).
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "6.0"
  # Same reason as DKB Monitor/Secret: the compiler must emit the exact runtime
  # keys for interpolated SwiftUI strings, or hand-written catalog entries
  # never match at runtime.
  SWIFT_EMIT_LOC_STRINGS: YES
  CODE_SIGN_STYLE: Manual
  DEVELOPMENT_TEAM: ""
  # Release only (plan D14). Xcode 16+ Debug builds link the app through a
  # generated <App>.debug.dylib, and Hardened Runtime's library validation
  # rejects that dylib under a non-Apple identity — confirmed in DKB-Secret.
  ENABLE_HARDENED_RUNTIME: NO
configs:
  Debug: debug
  Release: release
packages:
  DKBClamshellCore:
    path: DKBClamshellCore
targets:
  DKBClamshellApp:
    type: application
    platform: macOS
    sources:
      - DKBClamshellApp
    dependencies:
      - package: DKBClamshellCore
    info:
      path: DKBClamshellApp/Info.plist
      properties:
        # Source of truth for the version — Info.plist is regenerated from
        # this file on every `xcodegen generate`. scripts/release.sh edits
        # these two lines, not the plist.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "0.1.0"
        # Menu bar only (plan D4): no Dock icon, no main window.
        LSUIElement: true
        # Shown by macOS the first time the Full renderer starts a
        # ScreenCaptureKit stream (plan D5/F5).
        NSScreenCaptureUsageDescription: "DKB Clamshell reads the built-in display for about a second while the lid closes, to blur and darken it in step with the hinge. Nothing is stored or sent anywhere."
    entitlements:
      path: DKBClamshellApp/DKBClamshellApp.entitlements
      properties:
        # Not sandboxed (plan D14): IOKit HID access to the lid angle sensor
        # and ScreenCaptureKit are simpler outside the sandbox, and the app
        # holds nothing worth isolating. It makes no network calls at all.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dangkhoabach.dkb-clamshell
        PRODUCT_NAME: "DKB Clamshell"
        # Generated by scripts/generate-app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # Xcode injects get-task-allow (debugger attach) into every
          # Manual-signed build; keep it out of Release.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  DKBClamshellAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DKBClamshellAppTests
    dependencies:
      - target: DKBClamshellApp
    settings:
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DKB Clamshell.app/Contents/MacOS/DKB Clamshell"
      BUNDLE_LOADER: "$(TEST_HOST)"
